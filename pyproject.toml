[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.180,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
# Firestore, Firebase Functions, and the cloud artifact client are deliberately
# opt-in.  The normal installation only needs local rendering and Notion MCP.
cloud = [
    "firebase-admin>=7,<8",
    "firebase-functions>=0.4,<1",
    "google-cloud-storage>=3.1.1,<4",
]

[tool.setuptools.packages.find]
include = ["job_application_agents*", "integrations*"]
