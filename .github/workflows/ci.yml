name: CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JAA_ARTIFACT_ROOT: ${{ github.workspace }}/.render-service/artifacts
      JAA_FIREBASE_PROJECT_ID: demo-job-application-agents
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      JAA_WORKER_ID: github-emulator-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -e '.[cloud]'

      - name: Run unit and structural tests
        env:
          FIRESTORE_EMULATOR_HOST: ""
        run: python scripts/check.py

      - name: Start Firestore emulator and worker
        run: |
          mkdir -p "$JAA_ARTIFACT_ROOT"
          export JAA_HOST_UID="$(id -u)"
          export JAA_HOST_GID="$(id -g)"
          docker compose -f deploy/compose.yaml up -d --build --wait

      - name: Run Firestore repository tests
        run: python -m unittest job_application_agents.render_service.test_firestore -v

      - name: Run real XeLaTeX integration
        run: python scripts/check_render_service.py

      - name: Capture service logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color > "$RUNNER_TEMP/render-service.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-service-diagnostics
          path: |
            ${{ runner.temp }}/render-service.log
            ${{ runner.temp }}/jaa-render-artifacts

      - name: Stop render services
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
