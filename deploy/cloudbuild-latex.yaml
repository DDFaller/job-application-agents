steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/jaa-workers/latex-worker', '-f', 'deploy/docker/latex-worker/Dockerfile', '.']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/jaa-workers/latex-worker'

substitutions:
  _REGION: 'europe-west1'

options:
  logging: CLOUD_LOGGING_ONLY
