# Images push to Artifact Registry (REGION-docker.pkg.dev). Create the
# repository once per project:
#   gcloud artifacts repositories create jaa-workers --repository-format=docker \
#     --location=REGION --project=$PROJECT_ID
# and substitute _REGION at build time:
#   gcloud builds submit --config=deploy/cloudbuild.yaml --substitutions=_REGION=...
substitutions:
  _REGION: 'europe-west1'

steps:
  # 1. Build and push Playwright Worker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/jaa-workers/playwright-worker', '-f', 'deploy/docker/playwright-worker/Dockerfile', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/jaa-workers/playwright-worker']

  # 2. Build and push Notion Worker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/jaa-workers/notion-worker', '-f', 'deploy/docker/notion-worker/Dockerfile', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/jaa-workers/notion-worker']

  # 3. Build and push LaTeX Worker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/jaa-workers/latex-worker', '-f', 'deploy/docker/latex-worker/Dockerfile', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/jaa-workers/latex-worker']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/jaa-workers/playwright-worker'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/jaa-workers/notion-worker'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/jaa-workers/latex-worker'

options:
  logging: CLOUD_LOGGING_ONLY
